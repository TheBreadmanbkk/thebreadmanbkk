<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระเงิน - The Breadman.bkk</title>
    <link href="https://cdn.jsdelivr.net/npm/@line/seed@1.0.0/app.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #0621cd; --secondary-green: #757b5b; --bg-color: #fdfdfd; }
        body { font-family: 'LINE Seed Sans TH', sans-serif; background-color: var(--bg-color); color: #222; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        header { background-color: var(--primary-blue); color: white; width: 100%; padding: 15px 0; text-align: center; font-size: 24px; font-weight: bold; }
        .container { width: 90%; max-width: 500px; margin-top: 30px; margin-bottom: 50px; text-align: center; }
        h1 { color: var(--primary-blue); }
        
        .qr-box { background-color: white; border: 3px solid var(--primary-blue); border-radius: 20px; padding: 30px; margin-bottom: 20px; }
        .qr-placeholder { width: 100%; height: 250px; background-color: #eee; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #666; margin-bottom: 15px; border-radius: 10px; }
        
        .upload-box { background-color: #f4f5f0; border: 2px dashed var(--secondary-green); border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        
        .btn-done { display: block; width: 100%; background-color: var(--secondary-green); color: white; font-size: 22px; font-weight: bold; padding: 18px; border: none; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <header>The Breadman.bkk</header>
    <div class="container">
        <h1>ชำระเงิน</h1>
        <p style="font-size: 18px; color: #555;">สแกน QR Code เพื่อโอนเงินเข้าบัญชีร้าน</p>

        <div class="qr-box">
            <div class="qr-placeholder">
                📱 วางรูป QR Code รับเงินที่นี่
            </div>
            <h3 style="margin: 0; color: var(--primary-blue);">ธนาคาร: [ชื่อธนาคาร]</h3>
            <p style="margin: 5px 0 0 0; font-size: 18px;">ชื่อบัญชี: [ชื่อบัญชีร้าน]</p>
        </div>

        <div class="upload-box">
            <h3 style="color: var(--secondary-green); margin-top: 0;">แนบสลิปโอนเงิน</h3>
            <input type="file" accept="image/*" style="font-family: inherit; font-size: 16px;">
        </div>

        <button class="btn-done" onclick="finishOrder()">เสร็จสิ้น</button>
    </div>

    <script>
        function finishOrder() {
            alert("สั่งซื้อและส่งสลิปสำเร็จ! ขอบคุณที่อุดหนุน The Breadman.bkk ครับ");
            window.location.href = "index.html"; // กลับหน้าหลัก
        }
    </script>
</body>
</html>
